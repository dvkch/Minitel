    <line x1="0"   y1="2.9" x2="1.5" y2="2.9" />
    <line x1="4.3" y1="2.9" x2="5.8" y2="2.9" />
    <line x1="2.9" y1="0"   x2="2.9" y2="1.5" />
    <line x1="2.9" y1="4.3" x2="2.9" y2="5.8" />
</svg>
