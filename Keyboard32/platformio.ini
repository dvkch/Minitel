; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc1-n16r8

[env]
; pioarduino = Arduino core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
build_type = debug
debug_build_flags = -Os -ggdb3 -g3
build_src_flags =
    -Wall
    -Wextra
    -Werror=switch
    -Werror=implicit-fallthrough
    -Werror=return-type
    -Werror=narrowing
; native USB in TinyUSB mode (ESP32-S2/S3 only), started by the firmware itself to set its own identity,
; overriding the USB settings some board definitions force
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DKEYBOARD32_VERSION=\"0.6.0\"
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
; reflash through the firmware's USB serial port: a 1200 baud connection reboots it into the ROM bootloader
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; the core's USB library includes FS.h behind ESP-IDF config conditions the dependency scan cannot evaluate,
; `deep` scans all of its sources ignoring those conditions so the FS library gets added
lib_ldf_mode = deep

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_echo = yes
monitor_eol = LF
; the USB serial port only outputs while DTR is set, RTS is kept low to avoid resets
monitor_dtr = 1
monitor_rts = 0

[env:esp32-s3-devkitc1-n16r8]
board = esp32-s3-devkitc1-n16r8